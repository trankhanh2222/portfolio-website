<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Khanh, student. C++, competitive programming, AI experiments.</title>
    <meta
      name="description"
      content="Khanh is a student working in C++, competitive programming, AI experiments, and software development. Projects, a practice log, and ways to reach out."
    />
    <meta name="author" content="Khanh" />

    <!-- Open Graph, values are placeholders until the real URL and preview image exist -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Khanh, student. C++, competitive programming, AI experiments." />
    <meta
      property="og:description"
      content="Projects, a practice log, and ways to reach out. Built in the open, one notebook page at a time."
    />
    <meta property="og:url" content="[ SITE URL ]" />
    <meta property="og:image" content="[ SOCIAL PREVIEW IMAGE URL ]" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!--
      Theme is applied before first paint, so there is no flash of the wrong
      theme. React reads this attribute on mount and keeps it in sync.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'))
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
